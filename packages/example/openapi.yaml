# OpenAPI document for the example function. A plain Fission function has no HTTP contract of its own: the method and
# path come from the HTTPTrigger in .github/fission/package.yaml.tmpl, so this spec lives next to the function and is
# published with each release as the <name>-openapi.yaml asset (the trigger's catalog.squirrelhome.co.uk/openapi
# annotation holds its URL).
# __NAME__ and __SERVER_URL__ are filled in by .github/scripts/build-fission-package.sh (the server URL is API_BASE_URL,
# set in release.yml), so this file is a template and not valid OpenAPI until rendered.
openapi: 3.0.3

info:
  title: __NAME__
  version: 1.0.0
  description: >
    Example function deployed from a pre-built package. Turns the text query parameter into a URL slug using the vendored
    python-slugify library and returns both as JSON. The function scales to zero when idle, so the first request after a
    quiet period is a cold start of about 2-3 seconds.

servers:
  - url: __SERVER_URL__

paths:
  /__NAME__:
    get:
      operationId: getSlug
      summary: Slugify a piece of text
      parameters:
        - name: text
          in: query
          required: true
          description: The text to turn into a slug.
          schema:
            type: string
          example: Hello, World! Ünïcode too
      responses:
        "200":
          description: The original text and its slug.
          content:
            application/json:
              schema:
                type: object
                required: [text, slug]
                properties:
                  text:
                    type: string
                  slug:
                    type: string
              example:
                text: Hello, World! Ünïcode too
                slug: hello-world-unicode-too
        "400":
          description: The text query parameter is missing or empty.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
